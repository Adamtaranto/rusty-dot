name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "app/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  wasm-wheel:
    name: Build wasm wheel for the browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly with wasm32-unknown-emscripten target
        # Pinned nightly + emsdk pairing; see the wasm-build job in ci.yml
        # for why this exact combination is required.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-01
          targets: wasm32-unknown-emscripten
      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          # MUST match the Pyodide release bundled by shinylive
          # (Pyodide 0.27.x = CPython 3.12 + Emscripten 3.1.58).
          version: 3.1.58
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install maturin
        run: pip install maturin
      - name: Build wasm wheel
        run: >
          maturin build --release
          --target wasm32-unknown-emscripten
          --no-default-features
          -i python3.12
      - name: Check wheel platform tag
        run: ls target/wheels/*cp312-cp312-emscripten_3_1_58_wasm32.whl
      - name: Upload wasm wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-wasm-wheel
          path: target/wheels/*.whl

  deploy:
    name: Assemble site (docs + browser app) and deploy
    runs-on: ubuntu-latest
    needs: wasm-wheel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: pip install ".[docs]" shinylive
      - name: Download wasm wheel into the app
        uses: actions/download-artifact@v7
        with:
          name: app-wasm-wheel
          path: app/wheels
      - name: Build MkDocs site
        run: mkdocs build
      - name: Export browser app into the site
        # The wheel in app/wheels/ is bundled into the exported app.json and
        # installed from the Pyodide virtual filesystem at app startup.
        run: shinylive export app site/app
      - name: Deploy site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
