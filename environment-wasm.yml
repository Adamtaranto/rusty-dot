# Environment for building and serving the browser app (Shinylive / Pyodide).
#
# Separate from environment.yml because that env pins python-freethreading,
# which the wasm wheel build cannot use.
#
# Target: Pyodide 0.27.7 = CPython 3.12 + Emscripten 3.1.58, which is what
# shinylive bundles (verified against shinylive 0.10.14).  The emscripten pin
# is load-bearing: the wheel's platform tag derives from it
# (emscripten_3_1_58_wasm32) and micropip rejects a mismatch at app startup.
#
# Do not "upgrade" emscripten independently.  4.0.9 is the Pyodide 0.28/0.29
# ABI (CPython 3.13, WebAssembly exception handling) and its wheels cannot be
# installed by the runtime shinylive ships; that bump has to wait until
# shinylive itself moves to Pyodide 0.28+.
#
# `nodejs` is only needed for the optional smoke test (scripts/wasm_smoke_test.mjs).
#
# The Rust side needs a pinned nightly toolchain as well; see app/README.md.
name: rustydot-wasm
channels:
  - conda-forge
dependencies:
  - python 3.14
  - emscripten 3.1.58
  - shiny
  - nodejs
  - pip
  - pip:
      - maturin
      - shinylive
